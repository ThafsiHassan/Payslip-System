{% extends 'index.html' %}
    {% block content %}

    <div class="employee-table">
        <div class="heading">
        <h1><span>👥</span>Employee List</h1>
        <a class="add" href="{{ url_for('index') }}">✚ Add Employee</a>
        
        </div>

    <table cellpadding="10px">
        <thead>
            <th>employee_ID</th>
            <th>employee_name</th>
            <th>Designation</th>
            <th>Joining Date</th>
            <th>basic_salary</th>
            <th colspan="2">Actions</th>
        </thead>
        <tbody>
            {% for row in datas %}
            <tr>
                <td>{{row.E_ID}}</td>
                <td>{{row.Ename}}</td>
                <td>{{row.Desg}}</td>
                <td>{{row.Jdate}}</td>
                <td>{{row.B_salary}}</td>
                <td>
                    <button class="edit"><a class="edit1" href='{{url_for("edit",E_id=row.E_ID)}}'>Edit</a></button>
                </td>
                <td><button class="delete"><a href='{{url_for("delete",E_id=row.E_ID)}}' onclick='return confirm("Are you sure you want to delete this employee details?")'>Delete
                </a></button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    </div>

    {% endblock %}
